<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duo Test">
<meta name="theme-color" content="#1a1408">
<title>Duo Test v2</title>
<style>
  /* Same setup as the published Duo workaround: the page itself is not clipped,
     sideways dragging is turned off, and an extra column hangs off the right edge. */
  html { overflow-x: hidden; touch-action: pan-y pinch-zoom; background: #0a0806; }
  body { margin: 0; color: #e8dac0; font: 16px/1.35 -apple-system, system-ui, sans-serif;
    touch-action: pan-y pinch-zoom; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  .panel { margin: 12px; border: 2px solid #906010; border-radius: 18px; background: #1a1408; padding: 14px 16px; }
  h1 { margin: 0 0 6px; font-size: 20px; color: #e8cc60; }
  .note { color: #c8b080; font-size: 14px; margin: 0 0 10px; }
  pre { margin: 0 0 12px; white-space: pre-wrap; font: 13px/1.4 ui-monospace, Menlo, monospace; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: 700 16px -apple-system, system-ui, sans-serif; border-radius: 12px; border: 2px solid #7a5010;
    background: linear-gradient(#e8cc70, #c09020); color: #1a0c00; padding: 12px 16px; }
  /* The test column. Not inside any positioned or clipped box, so left:100% is the right edge of the page. */
  #edge { position: absolute; top: 0; left: 100%; width: 120px; height: 100vh;
    background: repeating-linear-gradient(45deg, #ff00aa 0 14px, #aa0077 14px 28px); }
  #edge button { position: absolute; left: 10px; width: 64px; height: 64px; padding: 0; border-radius: 50%;
    background: #fff; border-color: #000; color: #000; font-size: 22px; }
</style>
</head>
<body>
  <div class="panel">
    <h1>Duo strip test v2</h1>
    <p class="note">Look for a pink striped strip on the right. If you see round white buttons in it, tap A, B and C. Then tap the button below, then Copy results, and paste them in the chat. Try folded and unfolded.</p>
    <pre id="out">Loading…</pre>
    <div class="row">
      <button id="inside">Tap inside: 0</button>
      <button id="copy">Copy results</button>
    </div>
  </div>
  <div id="edge" aria-hidden="true">
    <button data-k="A" style="top:38%">A</button>
    <button data-k="B" style="top:52%">B</button>
    <button data-k="C" style="top:66%">C</button>
  </div>
  <div id="probe" style="position:fixed;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)"></div>
<script>
(function () {
  var taps = { A: 0, B: 0, C: 0 }, touches = 0, inside = 0;
  var out = document.getElementById('out'), edge = document.getElementById('edge');
  function report() {
    edge.style.height = Math.max(innerHeight, document.documentElement.scrollHeight) + 'px';
    var p = getComputedStyle(document.getElementById('probe'));
    var vv = window.visualViewport;
    out.textContent = [
      'Version:        v2',
      'Home screen:    ' + (navigator.standalone ? 'yes' : 'no'),
      'Page viewport:  ' + innerWidth + ' x ' + innerHeight + (vv ? ' (visual ' + Math.round(vv.width) + ')' : ''),
      'Document width: ' + document.documentElement.scrollWidth + ' (bigger than the viewport = the column is there)',
      'Safe area:      top ' + p.paddingTop + ', right ' + p.paddingRight + ', bottom ' + p.paddingBottom + ', left ' + p.paddingLeft,
      'Strip touches:  ' + touches,
      'Strip taps:     A ' + taps.A + ', B ' + taps.B + ', C ' + taps.C,
      'Inside taps:    ' + inside,
      'Browser:        ' + navigator.userAgent
    ].join('\n');
  }
  edge.addEventListener('pointerdown', function () { touches++; report(); });
  edge.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    taps[b.dataset.k]++; b.style.background = '#7cf27c'; report();
  });
  document.getElementById('inside').addEventListener('click', function () {
    inside++; this.textContent = 'Tap inside: ' + inside; report();
  });
  document.getElementById('copy').addEventListener('click', function () {
    var b = this, text = out.textContent;
    var ok = function () { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy results'; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, function () { b.textContent = 'Copy failed: screenshot instead'; });
    else b.textContent = 'Copy failed: screenshot instead';
  });
  addEventListener('resize', report);
  report();
})();
</script>
</body>
</html>
