<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duo Test">
<meta name="theme-color" content="#1a1408">
<title>Duo Test</title>
<style>
  /* The page never scrolls, so anything hung past the right edge stays put like a fixed rail would. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0806; color: #e8dac0;
    font: 16px/1.35 -apple-system, system-ui, sans-serif; touch-action: pan-y pinch-zoom;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { position: relative; }
  .panel { position: absolute; inset: 12px; overflow: auto; border: 2px solid #906010; border-radius: 18px;
    background: #1a1408; padding: 14px 16px; box-sizing: border-box; }
  h1 { margin: 0 0 6px; font-size: 20px; color: #e8cc60; }
  .note { color: #c8b080; font-size: 14px; margin: 0 0 10px; }
  pre { margin: 0 0 12px; white-space: pre-wrap; font: 13px/1.4 ui-monospace, Menlo, monospace; color: #e8dac0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: 700 16px -apple-system, system-ui, sans-serif; border-radius: 12px; border: 2px solid #7a5010;
    background: linear-gradient(#e8cc70, #c09020); color: #1a0c00; padding: 12px 16px; }
  /* The test column: hung just past the right edge of the page, where the Duo's strip is. */
  #strip { position: absolute; top: 0; left: 100%; height: 100%; width: 0; overflow: hidden;
    background: repeating-linear-gradient(45deg, #ff00aa 0 14px, #aa0077 14px 28px);
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 12px;
    padding-bottom: 24px; box-sizing: border-box; }
  #strip button { width: 64px; height: 64px; padding: 0; border-radius: 50%; background: #fff; border-color: #000; color: #000; font-size: 22px; }
</style>
</head>
<body>
  <div class="panel">
    <h1>Duo strip test</h1>
    <p class="note">If the right-hand strip turns pink and striped, the page can draw there. Tap the round white buttons in the strip (A, B, C), tap the button below, then tap Copy results and paste them in the chat. Try it folded and unfolded.</p>
    <pre id="out">Loading…</pre>
    <div class="row">
      <button id="inside">Tap inside: 0</button>
      <button id="copy">Copy results</button>
    </div>
  </div>
  <div id="strip" aria-hidden="true">
    <button data-k="A">A</button>
    <button data-k="B">B</button>
    <button data-k="C">C</button>
  </div>
  <div id="probe" style="position:fixed;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)"></div>
<script>
(function () {
  var taps = { A: 0, B: 0, C: 0, inside: 0 };
  var out = document.getElementById('out'), strip = document.getElementById('strip');
  function stripWidth() {
    var landscape = innerWidth > innerHeight;
    var sw = landscape ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    var gap = Math.round(sw - innerWidth);
    return { gap: gap, sw: sw };
  }
  function report() {
    var s = stripWidth();
    strip.style.width = (s.gap > 0 ? s.gap : 0) + 'px';
    var p = getComputedStyle(document.getElementById('probe'));
    var mode = ['fullscreen', 'standalone', 'minimal-ui', 'browser'].find(function (m) { return matchMedia('(display-mode: ' + m + ')').matches; }) || 'unknown';
    out.textContent = [
      'Opened as:      ' + mode + (navigator.standalone ? ' (home screen app)' : ''),
      'Screen:         ' + screen.width + ' x ' + screen.height + ' (dpr ' + devicePixelRatio + ')',
      'Page viewport:  ' + innerWidth + ' x ' + innerHeight,
      'Strip width:    ' + s.gap + ' px',
      'Safe area:      top ' + p.paddingTop + ', right ' + p.paddingRight + ', bottom ' + p.paddingBottom + ', left ' + p.paddingLeft,
      'Strip taps:     A ' + taps.A + ', B ' + taps.B + ', C ' + taps.C,
      'Inside taps:    ' + taps.inside,
      'Browser:        ' + navigator.userAgent
    ].join('\n');
  }
  strip.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    taps[b.dataset.k]++; b.style.background = '#7cf27c'; report();
  });
  document.getElementById('inside').addEventListener('click', function () {
    taps.inside++; this.textContent = 'Tap inside: ' + taps.inside; report();
  });
  document.getElementById('copy').addEventListener('click', function () {
    var b = this, text = out.textContent;
    var done = function () { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy results'; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { b.textContent = 'Copy failed: screenshot instead'; });
    else b.textContent = 'Copy failed: screenshot instead';
  });
  addEventListener('resize', report);
  report();
})();
</script>
</body>
</html>
